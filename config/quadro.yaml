# Quadro de indicadores da resposta (SINTÉTICO). Metas anuais por UF.
# unidade: pessoas | atividades
# agregacao_tempo: soma (fluxo mensal), maximo (estoque: pico no ano), ultimo (acumulado no ano)
# principal: indicador de pessoas atendidas do setor, usado na estimativa de pessoas únicas
ano: 2025
metodo_oficial_pessoas_unicas: maximo_municipio
limiar_divulgacao: 5
desagregacoes:
  sexo: {f: Feminino, m: Masculino}
  faixa_etaria: {"0_17": "0 a 17 anos", "18_59": "18 a 59 anos", "60m": "60 anos ou mais"}

setores:
  protecao:
    nome: Proteção
    indicadores:
      PRO-01:
        nome: Pessoas atendidas em gestão de casos de proteção (novas no mês)
        unidade: pessoas
        agregacao_tempo: soma
        desagregacoes: [sexo, faixa_etaria]
        principal: true
      PRO-02:
        nome: Sessões de orientação jurídica e informação sobre direitos
        unidade: atividades
        agregacao_tempo: soma
        desagregacoes: []
      PRO-03:
        nome: Pessoas com documentação regularizada (acumulado no ano)
        unidade: pessoas
        agregacao_tempo: ultimo
        desagregacoes: [sexo, faixa_etaria]
  abrigo:
    nome: Abrigo
    indicadores:
      ABR-01:
        nome: Pessoas atendidas com abrigo temporário (novas no mês)
        unidade: pessoas
        agregacao_tempo: soma
        desagregacoes: [sexo, faixa_etaria]
        principal: true
      ABR-02:
        nome: Pessoas abrigadas no último dia do mês
        unidade: pessoas
        agregacao_tempo: maximo
        desagregacoes: [sexo, faixa_etaria]
      ABR-03:
        nome: Kits de itens não alimentares distribuídos
        unidade: atividades
        agregacao_tempo: soma
        desagregacoes: []
  integracao:
    nome: Integração socioeconômica
    indicadores:
      INT-01:
        nome: Pessoas atendidas em integração socioeconômica (novas no mês)
        unidade: pessoas
        agregacao_tempo: soma
        desagregacoes: [sexo, faixa_etaria]
        principal: true
      INT-02:
        nome: Pessoas inseridas no mercado de trabalho (acumulado no ano)
        unidade: pessoas
        agregacao_tempo: ultimo
        desagregacoes: [sexo, faixa_etaria]
  saude:
    nome: Saúde
    indicadores:
      SAU-01:
        nome: Pessoas atendidas em serviços de saúde (novas no mês)
        unidade: pessoas
        agregacao_tempo: soma
        desagregacoes: [sexo, faixa_etaria]
        principal: true
      SAU-02:
        nome: Consultas e atendimentos de saúde realizados
        unidade: atividades
        agregacao_tempo: soma
        desagregacoes: []
      SAU-03:
        nome: Unidades de saúde apoiadas
        unidade: atividades
        agregacao_tempo: maximo
        desagregacoes: []

