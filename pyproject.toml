[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monitoring-5w-kit"
version = "0.1.0"
description = "Monitoramento de resposta humanitária no formato 5W: validação de relatos, metas e dupla contagem, com dados 100% sintéticos"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy==2.2.6",
    "pandas==2.2.3",
    "Faker==30.8.2",
    "PyYAML==6.0.2",
    "Jinja2==3.1.4",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "ruff==0.7.4"]

[project.scripts]
m5w = "m5w.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
m5w = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]
