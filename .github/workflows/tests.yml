name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar (sem rede em tempo de execução: só dependências do PyPI)
        run: pip install -e ".[dev]"
      - name: Estilo (ruff)
        run: ruff check .
      - name: Testes (pytest)
        run: pytest -v
      - name: Pipeline completo do zero
        run: |
          rm -rf data/sintetico
          make run
      - name: Conferir que reports/metricas.json se reproduz
        run: git diff --exit-code -- reports/metricas.json
      - name: Conferir que nenhum relatório versionado mudou
        run: git diff --stat --exit-code -- reports/
